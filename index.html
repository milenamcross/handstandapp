<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171a17">
<meta name="description" content="Em breve, conheça os programas e produtos de Milena Miranda.">
<title>Milena Miranda | Em breve</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:#f5f3ed;color:#202720;font-family:Arial,Helvetica,sans-serif}
main{width:100%;max-width:740px;padding:clamp(32px,7vw,72px);border:1px solid #d9ddd2;border-radius:24px;background:#fffef9}
.brand{font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:0 0 72px}
.label{display:inline-block;padding:8px 12px;border-radius:30px;background:#e9eddf;color:#4e5b3e;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h1{font-size:clamp(38px,7vw,64px);line-height:1.06;letter-spacing:-.04em;margin:24px 0}
p{font-size:18px;line-height:1.65;max-width:480px;color:#5a6258;margin:0}
footer{margin-top:64px;font-size:13px;color:#747b6e}
@media(max-width:480px){.brand{margin-bottom:48px}footer{margin-top:48px}}
</style>
</head>
<body>
<main>
<div class="brand">Milena Miranda</div>
<span class="label">Site em construção</span>
<h1>Um novo espaço<br>está chegando.</h1>
<p>Em breve, você encontrará aqui meus programas de treinamento, produtos e novidades.</p>
<footer>Movimento, força e novas possibilidades.</footer>
</main>
</body>
</html>
